name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn tsc

      - name: Build frontend assets
        run: yarn build:production

      # The version displayed in the admin (and used to compare against the
      # upstream CDN manifest) comes from config/app.php. Strip the leading "v"
      # from the tag so a tag like v1.15.1.1 becomes version "1.15.1.1".
      - name: Set panel version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i "s/'canary'/'${VERSION#v}'/" config/app.php
          grep -n "'version'" config/app.php

      - name: Create release archive
        run: |
          rm -rf node_modules tests CONTRIBUTING.md flake.lock flake.nix phpunit.xml shell.nix
          tar -czf panel.tar.gz * .editorconfig .env.example .eslintignore .eslintrc.js .gitignore .prettierrc.json

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: |
            panel.tar.gz
